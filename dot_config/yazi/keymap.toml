# keymap.toml
[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"

[[mgr.prepend_keymap]]
on = "H"
run = "plugin duckdb -1"
desc = "Scroll one column to the left"

[[mgr.prepend_keymap]]
on = "L"
run = "plugin duckdb +1"
desc = "Scroll one column to the right"

[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "plugin duckdb -open"
desc = "open with duckdb"

[[mgr.prepend_keymap]]
on = ["g", "u"]
run = "plugin duckdb -ui"
desc = "open with duckdb ui"


[[mgr.prepend_keymap]]
on = ["g", "M"]
run = "plugin toggle-pane max-preview"
desc = "Maximize preview"

[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "plugin toggle-pane reset"
desc = "Restore layout"


[[mgr.prepend_keymap]]
on   = [ "c", "r" ]
run  = "plugin copy-rel"
desc = "Copy relative path(s)"

[[mgr.prepend_keymap]]
on   = [ "E" ]
run  = "plugin euporie"
desc = "Open interactive console"

[[mgr.prepend_keymap]]
on   = [ "<Space>", "v", "d" ]
run  = "plugin visidata"
desc = "Open with visidata"

[[mgr.prepend_keymap]]
on   = [ "<Space>", "f", "x" ]
run  = "plugin fx"
desc = "Browse with fx"

[[mgr.prepend_keymap]]
on   = [ "<Space>", "b" ]
run  = "shell 'bat --paging=always \"$@\"' --block --confirm"
desc = "Open with bat"

[[mgr.prepend_keymap]]
on   = [ "<Space>", "l" ]
run  = "shell 'tail -f \"$@\" | bat --paging=never -l log' --block --confirm"
desc = "Tail log with bat"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Toggle full-screen preview"

# XPCC navigation: follow linked run outputs
# Added to ~/.config/yazi/keymap.toml by install.py.
[[mgr.prepend_keymap]]
on = "s"
run = 'search --via=fd --args="--follow --no-ignore"'
desc = "Search filenames through symlinks, including ignored run outputs"
