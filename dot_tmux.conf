# allow image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

if-shell 'test -x "$HOME/.local/bin/zsh"' 'set-option -g default-shell ~/.local/bin/zsh'

set-option -sg escape-time 10
set-option -g focus-events on	 
set -g default-terminal "tmux-256color" 
set -ag terminal-overrides ",xterm-256color:RGB"


# Change prefix to Ctrl-q (AZERTY keyboard)
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

bind r   source ~/.tmux.conf


# vi mode
set-option -g history-limit 10000
setw -g mode-keys vi
unbind-key [
bind 'C-c' copy-mode

bind c new-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind 'P' choose-buffer
bind 'p' paste-buffer
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.local/bin/yank"
bind-key -T copy-mode-vi r send -X rectangle-toggle

bind P paste-buffer
bind C-l send-keys 'C-l'

set -g set-clipboard on

#Nested
#Variables
color_status_text="colour245"
color_window_off_status_bg="colour238"
color_light="white" #colour015
color_dark="colour232" # black= colour232
color_window_off_status_current_bg="colour254"
bind -T root F12  \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
  set window-status-current-format "#[fg=$color_window_off_status_bg,bg=$color_window_off_status_current_bg]$separator_powerline_right#[default] #I:#W# #[fg=$color_window_off_status_current_bg,bg=$color_window_off_status_bg]$separator_powerline_right#[default]" \;\
  set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S
  
wg_is_keys_off="#[fg=$color_light,bg=$color_window_off_indicator]#{?#{==:#{client_key_table},off},OFF,}#[default]"

set-option -g allow-rename off
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{pane_current_command}'

set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style none
set -g @catppuccin_status_background none
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100
set -g status-right "$wg_is_keys_off#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Refresh terminal pixel sizes after changing Ghostty font size.
bind-key R run-shell -b '~/.local/bin/terminal-resync --client "#{client_tty}"'
